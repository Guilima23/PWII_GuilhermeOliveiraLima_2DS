<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>CRUD - Cadastro de Funcionários</title> 
  <link rel="stylesheet" href="Style.css"> 
  <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'> 
</head> 
<body> 
  <div class="container"> 
    <div class="header"> 
      <span>Cadastro de Funcionários</span> 
      <button onclick="openModal()" id="new">Incluir</button> 
    </div> 
 
    <div class="divTable"> 
      <table> 
        <thead> 
          <tr> 
            <th>Nome</th> 
            <th>Idade</th>
            <th>RG</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Função</th> 
            <th>Salário</th> 
            <th class="acao">Editar</th> 
            <th class="acao">Excluir</th> 
          </tr> 
        </thead>
        <tbody> 
          </tbody> 
      </table> 
    </div> 
 
    <div class="modal-container"> 
      <div class="modal"> 
        <h2>Dados do Funcionário</h2>
        <form id="meuFormulario"> 
          <label for="m-nome">Nome</label> 
          <input id="m-nome" type="text" required /> 

          <label for="m-idade">Idade</label> 
          <input id="m-idade" type="text" oninput="validarNumeros(this)" required /> 

          <label for="m-rg">RG (11 dígitos)</label> 
          <input id="m-rg" type="text" maxlength="11" oninput="validarNumeros(this)" required /> 

          <label for="m-cpf">CPF (11 dígitos)</label> 
          <input id="m-cpf" type="text" maxlength="11" oninput="validarNumeros(this)" required /> 

          <label for="m-email">E-mail</label> 
          <input id="m-email" type="email" required /> 
   
          <label for="m-funcao">Função</label> 
          <input id="m-funcao" type="text" required /> 
   
          <label for="m-salario">Salário (R$)</label> 
          <input id="m-salario" type="number" step="0.01" required /> 
          
          <div class="botoes-modal" style="margin-top: 15px; display: flex; gap: 10px;">
            <button type="submit" id="btnSalvar">Salvar</button> 
            <button type="button" onclick="fecharModal()">Cancelar</button>
          </div>
        </form> 
      </div> 
    </div> 
  </div> 
  <script src="funcionario.js"></script>
</body> 
</html>
